<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
    }
    .mensaje {
      color: #5c93c4;
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.6;
      /* Efecto de borde/sombra similar a tu imagen */
      text-shadow: 1px 1px 0px #ffffff, 
                  -1px -1px 0px #ffffff, 
                   2px 2px 4px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <div class="mensaje">
    Estoy en el cine.<br><br>
    Nos vemos a la salida<br>
    a las 21:00 h
  </div>

</body>
</html>
